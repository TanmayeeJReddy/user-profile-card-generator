<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Generator</title>
</head>
<body>
    <h1>Create Your Profile</h1>
    
    <!-- The form sends a POST request to the /create-profile server endpoint -->
    <form action="/create-profile" method="POST">
        
        <div>
            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name" required>
        </div><br>

        <div>
            <label for="bio">Bio:</label><br>
            <textarea id="bio" name="bio" rows="4" required></textarea>
        </div><br>

        <div>
            <label for="skills">Skills (comma-separated):</label><br>
            <input type="text" id="skills" name="skills" placeholder="JavaScript, Node.js, HTML" required>
        </div><br>

        <div>
            <label for="github">GitHub Profile Link:</label><br>
            <input type="url" id="github" name="github" placeholder="https://github.com/username">
        </div><br>

        <div>
            <label for="linkedin">LinkedIn Profile Link:</label><br>
            <input type="url" id="linkedin" name="linkedin" placeholder="https://linkedin.com/in/username">
        </div><br>

        <button type="submit">Generate Profile Card</button>
    </form>
</body>
</html>
